[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/api",
    "crates/l10n",
    "crates/web",
    "crates/adapters/config",
    "crates/adapters/engine",
    "crates/adapters/http",
    "crates/adapters/hooks",
    "crates/adapters/interop",
    "crates/adapters/notify",
    "crates/adapters/platform",
    "crates/adapters/secrets",
    "crates/adapters/store",
    "crates/spawn-gate",
    "crates/testkit",
]
# `web` only builds for wasm32 with trunk; host commands skip it unless asked.
default-members = [
    ".",
    "crates/domain",
    "crates/app",
    "crates/api",
    "crates/l10n",
    "crates/adapters/config",
    "crates/adapters/engine",
    "crates/adapters/http",
    "crates/adapters/hooks",
    "crates/adapters/interop",
    "crates/adapters/notify",
    "crates/adapters/platform",
    "crates/adapters/secrets",
    "crates/adapters/store",
    "crates/spawn-gate",
    "crates/testkit",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nledford/Ladderback"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
app = { path = "crates/app" }
api = { path = "crates/api" }
# No default features: the dev pseudolocales are a feature of `l10n` that
# `ladderback` and `web` each pass on through their own `pseudo` feature, so a
# release build can leave them out (technical design §8.4).
l10n = { path = "crates/l10n", default-features = false }
# Not `config`: a registry crate of that name is already in the lockfile.
config-adapter = { path = "crates/adapters/config" }
engine = { path = "crates/adapters/engine" }
hooks = { path = "crates/adapters/hooks" }
notify-adapter = { path = "crates/adapters/notify" }
interop = { path = "crates/adapters/interop" }
http-adapter = { path = "crates/adapters/http" }
platform = { path = "crates/adapters/platform" }
secrets = { path = "crates/adapters/secrets" }
store = { path = "crates/adapters/store" }
spawn-gate = { path = "crates/spawn-gate" }
testkit = { path = "crates/testkit" }

# The admin password's hash, argon2id (security §10.1, decision 70). `std`
# brings the operating system's randomness, for its salt and session tokens.
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.92"
# `ws` carries the live-updates WebSocket at `/api/v1/events` (§4.2).
axum = { version = "0.8.9", features = ["ws"] }
# The hash of the entry page's inline script, in its content security policy
# (technical design §10.1).
base64 = "0.22.1"
# The bytes rustic_core's backend trait hands over; `adapters/engine` wraps
# a backend (technical design §4.1).
bytes = { version = "1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
# Time goes through `jiff` alone (decision 22): `croner`'s default `chrono`
# feature stays off, and `just architecture` bans `chrono` from `domain`.
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
cucumber = "0.23.0"
# The D-Bus error inside a Secret Service failure, by name: `secrets` tells no
# session bus or no daemon from a call that failed (security §10.2). Its tests
# build those errors; the code reads the one `dbus-secret-service` hands back.
dbus = { version = "0.9.12", default-features = false }
# The error type `keyring` boxes for a Secret Service failure on Linux, which
# `secrets` downcasts to. It must be the very version `keyring` uses: `just
# architecture` checks that the build has one.
dbus-secret-service = { version = "4.1.0", default-features = false }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
# ICU4X's decimal type: the number a locale-aware formatter writes.
fixed_decimal = { version = "0.7.3", default-features = false }
fluent-bundle = "0.16.0"
# Not 0.14: it negotiates `icu_locid` identifiers, which `unic-langid`, and so
# Fluent's bundles, can't take.
fluent-langneg = "0.13.1"
# The dev pseudolocales' transform, optional in `l10n` (technical design §8.4).
fluent-pseudo = "0.3.3"
fluent-syntax = "0.12.0"
futures = "0.3.34"
# The web UI's REST client (§4.4): `fetch` with typed JSON bodies, on wasm.
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
http-body-util = "0.1.5"
# The web UI's `sleep` (§4.4): the reconnect backoff and the settle-poll wait
# in the browser's own time.
gloo-timers = { version = "0.3", default-features = false, features = ["futures"] }
# ICU4X writes the daemon's numbers and instants (technical design §8.4), behind
# `l10n`'s `icu` feature. No defaults: `compiled_data` bakes in the locale data
# for the formatters used, `alloc` is what parsing a locale and writing a
# decimal need, and `ixdtf` (parsing dates) is not used. `icu_provider`'s `sync`
# makes the formatters `Send + Sync`, which a bundle's memoizer needs: without
# it, their data payloads hold an `Rc`.
icu_calendar = { version = "2.4.0", default-features = false }
icu_datetime = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.4.0", default-features = false, features = ["alloc", "compiled_data"] }
icu_locale_core = { version = "2.4.0", default-features = false, features = ["alloc"] }
icu_provider = { version = "2.4.0", default-features = false, features = ["sync"] }
icu_time = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
intl-memoizer = "0.5.3"
# `tzdb-bundle-always` carries a copy of the IANA time-zone database in every
# build, for a host with no system database (a container image without
# `tzdata`). `jiff` reads the system's copy first and uses the bundled one only
# when it finds none; on wasm it bundles by default, and this keeps that from
# depending on the default (technical design §3.2, §16 decision 29).
jiff = { version = "0.2.40", features = ["serde", "tzdb-bundle-always"] }
# The browser's `Intl`, which `l10n`'s `browser-intl` feature writes the web UI's
# numbers and instants with (technical design §8.4).
js-sys = "0.3.107"
keyring = { version = "3.6.3", default-features = false }
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8"
log = "0.4.35"
mime_guess = "2.0.5"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
proc-macro2 = "1.0.107"
# Property tests (technical design §13.3), a dev-dependency only. `std` alone:
# the default `fork` and `timeout` features run each case in a child process,
# which no property here needs, and pull in `rusty-fork` and `tempfile`.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# The notifications adapter's HTTP client (technical design §8.2, §11), and
# the type of the errors of rustic's REST backend, which `engine` reads the
# server's status from: no defaults, rustls for TLS. Already in the tree
# through `rustic_backend`, with these features and more, so it adds no
# package.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust-embed = "8.13.0"
# One git revision of rustic's `main`, because `Progress::error` is unreleased
# (technical design §2.1). The `engine` crate depends on them, and so do the
# root tests, which initialize scratch repositories and list their snapshots.
rustic_backend = { git = "https://github.com/rustic-rs/rustic_core", rev = "01fe284ac43d34bde9334210bcd40f824a0d8c69" }
rustic_core = { git = "https://github.com/rustic-rs/rustic_core", rev = "01fe284ac43d34bde9334210bcd40f824a0d8c69" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Hashes the entry page's inline script (see `base64`), and a session's token
# into the key its session is kept by (security §10.1).
sha2 = "0.10.9"
shell-words = "1.1.1"
signal-hook = "0.4.6"
# No `any`, `json` or TLS: the store is SQLite only. `migrate!` is a macro.
# `sqlite-bundled` rather than `sqlite`, which adds extension loading,
# (de)serializing a database and unlock notification (for a shared cache,
# which the store doesn't use): none of them is called.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
# Compares a session's tokens in constant time (security §10.1, decision 70).
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = "1.54.1"
# The e2e scenarios speak the events WebSocket with this client; no TLS: the
# daemon listens on loopback.
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "handshake"] }
# `preserve_order` keeps a table's keys in file order, so the first unknown key
# the config adapter reports is the first one in the file.
toml = { version = "1.2.1", features = ["preserve_order"] }
# The config adapter adds a recorded repository ID to `config.toml` as the
# person wrote it, keeping every other byte (decision 57); already in the
# tree through `proc-macro-crate`.
toml_edit = "0.25.19"
tower = "0.5.3"
unic-langid = { version = "0.9.6", features = ["macros"] }
url = "2.5.8"
uuid = { version = "1.29.1", features = ["serde"] }
# `JsValue` for the browser host, and the `wasm-bindgen-test` lanes that run
# under Node (`just test-wasm`).
wasm-bindgen = "0.2.130"
wasm-bindgen-test = "0.3.80"
# The browser APIs `web` reads the page's language from, declares it with, and
# writes the live regions, focus and the events WebSocket through (§4.4), and
# aborts a read of the daemon that hangs with.
web-sys = { version = "0.3.107", features = ["AbortController", "AbortSignal", "BinaryType", "CloseEvent", "Document", "Element", "ErrorEvent", "HtmlDialogElement", "HtmlElement", "Location", "MessageEvent", "Navigator", "Node", "NodeList", "Performance", "UrlSearchParams", "WebSocket", "Window"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Development builds carry line tables, not full debug info: a backtrace still
# names the file and line of every Ladderback frame, while the target folder
# shrinks and links go faster. Dependencies get none (their frames keep their
# function names), whether built for the code or for a build script or proc
# macro, so debug info never makes the two builds of a dependency differ. For
# a debugger, build the `debugging` profile below. Technical design §13.11.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Ladderback's own build scripts get none either. `package."*"` doesn't reach
# them, and Cargo drops their debug info in a host build only: a `--target
# wasm32-unknown-unknown` build would give them line tables, a second build of
# each script beside the host build's.
[profile.dev.build-override]
debug = false

# Every test that opens a repository derives its key with scrypt, and
# rustic encrypts and compresses every blob; unoptimized, these dominate
# test time. Only these crates are optimized, so debugging Ladderback's own
# code is unaffected.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.aes256ctr_poly1305aes]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# A build to debug in: full debug info for Ladderback's crates and every
# dependency, in its own folder (`target/debugging`), so switching to it and
# back rebuilds neither. `cargo build --profile debugging`, or for tests `cargo
# nextest run --cargo-profile debugging`. It keeps dev's other settings, the
# optimized crates above included.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

# The profile cargo-dist builds the release binaries with (dist-workspace.toml,
# technical design §12.1): the release profile with thin LTO, dist's default.
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "ladderback"
description = "Self-hosted backup manager for rustic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cargo-dist builds this package alone (dist-workspace.toml): `publish = false`
# would otherwise leave it out, and `dist = false` there leaves out the rest.
[package.metadata.dist]
dist = true

[[test]]
name = "e2e"
harness = false

[features]
# The dev pseudolocales `en-XA` and `ar-XB` for the daemon's messages
# (technical design §8.4). A release build passes `--no-default-features`, and
# `just architecture` checks that this leaves `fluent-pseudo` out of it.
default = ["pseudo"]
pseudo = ["l10n/pseudo"]

[dependencies]
api.workspace = true
app.workspace = true
async-trait.workspace = true
engine.workspace = true
futures.workspace = true
http-adapter.workspace = true
interop.workspace = true
# The daemon formats numbers and instants with ICU4X; the web UI's `l10n` has
# no `icu` feature, so a browser never downloads the locale data.
l10n = { workspace = true, features = ["icu"] }
axum.workspace = true
clap.workspace = true
config-adapter.workspace = true
domain.workspace = true
env_logger.workspace = true
hooks.workspace = true
log.workspace = true
notify-adapter.workspace = true
platform.workspace = true
secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
app = { workspace = true, features = ["fakes"] }
async-trait.workspace = true
cucumber.workspace = true
config-adapter.workspace = true
domain.workspace = true
futures.workspace = true
log.workspace = true
nix = { workspace = true, features = ["fs"] }
platform.workspace = true
rustic_backend.workspace = true
hooks.workspace = true
rustic_core.workspace = true
secrets.workspace = true
spawn-gate.workspace = true
sqlx.workspace = true
store.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio-tungstenite.workspace = true
testkit.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
