# Every job runs the same `just` recipes developers and agents run locally.
# The red-first check is in red-first.yml.
#
# mr boxington (mbx) caches Cargo builds: pushes to main save the cache, pull
# requests only restore it. It keeps one build per OS and commit, under one
# key, and the first job to finish saves it; before, that was `Wasm tests`, a
# few hundred megabytes, and every other Linux job restored it and rebuilt
# nearly every crate. So on Linux only `Check (ubuntu-latest)` saves under that
# key: it builds the most, and `Release-build tests`, the host part of `UI
# journeys` and red-first.yml start from its build. `UI journeys`,
# `Release-build tests` and both `Service managers` jobs empty their target
# dir after their last step on a push (on macOS too, leaving that OS's save
# to `Check (macos-latest)`), and mbx skips the save of a job with no build
# to keep. `Wasm tests` builds wasm32 tests, which Check doesn't, so it keeps
# a cache of its own (`cache-generation`), a few hundred megabytes. A cache
# per job doesn't fit: the repository's Actions cache holds 10 GB, and the
# macOS build alone takes 4.7. If Check fails on a push, that commit saves no
# Linux build, and pull requests restore the one before.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *" # nightly full mutation run
  workflow_dispatch:

permissions:
  contents: read

# On pull requests only a push (`synchronize`) may cancel a run; any other
# pull request run (opened, reopened) gets a group of its own, so a required
# check is never left cancelled on the commit being merged (see red-first.yml).
# The nightly run and manual runs get a group of their own too: GitHub keeps
# one pending run per group and cancels the older one when another queues, so
# sharing main's queue, nightly run 43208497343 (2026-11-12) was cancelled
# before any job started, when a push to main queued behind it; and a running
# nightly (the full mutation run takes up to 180 minutes) held main's push CI
# behind it. Only pushes to main share one group, and queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event_name == 'pull_request' && github.event.action != 'synchronize') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'serial' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI builds are cached and thrown away, never debugged in place. The restored
  # target dir already makes a build incremental crate by crate; rustc's own
  # incremental mode would only add its session files to every cache entry.
  # The mbx action doesn't set it. Debug info is Cargo.toml's dev profile, the
  # same as a local build's.
  CARGO_INCREMENTAL: 0

jobs:
  # Tells a docs-only pull request from one that touches code, with plain git,
  # so the jobs below can skip the Rust work. Anything that isn't clearly docs
  # counts as code, and so does a failure here: the jobs below run unless this
  # job says "true". Pushes to main and the nightly run skip this job and run
  # everything.
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.diff.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A failing git command fails this step, and then every job below runs.
          git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          docs_only=true
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            case "$file" in
              # Markdown under crates/ can be include_str!'d or doc-tested.
              crates/*) docs_only=false ;;
              # The guides' config.toml and keyring examples are tested
              # (crates/adapters/config/tests/guide.rs).
              docs/guide/*) docs_only=false ;;
              docs/* | LICENSE* | .github/ISSUE_TEMPLATE/* | *.md) ;;
              *) docs_only=false ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          # A change with no files isn't a docs change.
          if [ "$count" -eq 0 ]; then docs_only=false; fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    name: Check (${{ matrix.name }})
    needs: changes
    # A docs-only pull request skips every step but not the job. A matrix job
    # that its own `if` skips never creates the per-leg checks the ruleset
    # requires ("Check (ubuntu-latest)", "Check (macos-latest)"), so they would
    # stay "Expected" and block the merge. ui and mutants have fixed names and
    # skip as whole jobs.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      # `name` is the leg's name in the check the ruleset requires, so it
      # stays `ubuntu-latest` and `macos-latest`; `os` is the runner image,
      # pinned, and a pull request of its own bumps it (development.md §13.8).
      matrix:
        include:
          - name: ubuntu-latest
            os: ubuntu-26.04
          - name: macos-latest
            os: macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Every pull request is checked out: a docs-only one still runs the
      # agent-guidance path check below, which `just lint` runs for the rest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.docs-only == 'true'
        run: scripts/check-doc-paths.sh
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - if: needs.changes.outputs.docs-only != 'true'
        run: rustup toolchain install
      # A build-cache outage must not fail a required check: with the step
      # allowed to fail, the build runs uncached (slower, still correct). The
      # same applies to the other mr-boxington steps below.
      - if: needs.changes.outputs.docs-only != 'true'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      # Only the host clippy and the tests can differ by OS (`cfg(target_os)`
      # code). Formatting, the wasm32 clippy, the journey and doc-path lints,
      # the architecture checks and the contrast gate give one answer
      # anywhere, so they run on Linux alone; macOS needs no Node then. Every
      # setup-node reads Node's major version from ui-tests/.nvmrc, which a
      # pull request of its own bumps (development.md §13.8).
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - if: needs.changes.outputs.docs-only != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      # leptosfmt at the version the Justfile pins, for `just fmt-check`.
      # install-action lists no leptosfmt (manifests/ at that SHA), so it
      # falls back to cargo-binstall at that version, which takes the
      # release's prebuilt binary, as for wasm-bindgen in red-first.yml.
      - id: leptosfmt
        if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: echo "version=$(just --evaluate leptosfmt_version)" >> "$GITHUB_OUTPUT"
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: leptosfmt@${{ steps.leptosfmt.outputs.version }}
      # The rustic CLI the profile golden tests compare against (§6.2): the
      # official release, checked against the SHA-256 the script pins.
      - if: needs.changes.outputs.docs-only != 'true'
        run: scripts/install-rustic.sh
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: npm ci
        working-directory: ui-tests
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just fmt-check
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just lint
      - if: needs.changes.outputs.docs-only != 'true' && runner.os != 'Linux'
        run: just clippy
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just architecture
      - if: needs.changes.outputs.docs-only != 'true' && runner.os == 'Linux'
        run: just test-contrast
      # The ci profile (.config/nextest.toml) retries, reports flaky tests and
      # writes the JUnit report.
      - if: needs.changes.outputs.docs-only != 'true'
        run: just test
        env:
          NEXTEST_PROFILE: ci
      # Kept 14 days, not the repository's default of 90: a report is read
      # while its failure is fresh, and two weeks still covers a run looked at
      # after a week away. The same holds for both `mutants.out` uploads below.
      - if: always() && needs.changes.outputs.docs-only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.name }}
          path: target/nextest/ci/junit.xml
          retention-days: 14

  ui:
    name: UI journeys (Chromium, axe-core, keyboard)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      # trunk downloads wasm-bindgen and wasm-opt (binaryen) from GitHub
      # releases on a cold build; during a releases outage those 504 and fail
      # the job. Cache its tools so only the first build after a lockfile
      # change fetches them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-tools-${{ runner.os }}-
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,trunk
      - run: npm ci
        working-directory: ui-tests
      - uses: $/.github/actions/chromium
      - run: just test-ui
      # Leaves the build cache to `Check (ubuntu-latest)` (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The wasm-bindgen tests (`#[wasm_bindgen_test]`) under Node. Not a required
  # check: add it to the ruleset once it has proved stable. The wasm32 target
  # comes with the toolchain (rust-toolchain.toml). The test runner must be the
  # version of `wasm-bindgen` that Cargo.lock pins, so `just` reads it from the
  # lockfile and a second install step fetches that release's binaries. A
  # release that the pinned action doesn't list isn't an error: see the same
  # step in red-first.yml.
  wasm:
    name: Wasm tests (Node)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      # Its own cache key, not Check's (top of this file).
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
        with:
          cache-generation: v1-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ui-tests/.nvmrc
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just
      - id: wasm-bindgen
        run: echo "version=$(just _wasm-bindgen-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - run: just test-wasm

  # actionlint and zizmor on the workflows (`just lint-workflows`). zizmor's
  # online audits (known-vulnerable actions, impostor commits) read public
  # GitHub data with the run's read-only token. Not a required check: the
  # maintainer may add it to the ruleset once it has proved stable.
  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,zizmor
      # Not in install-action's list: the official release, checked against
      # the SHA-256 the script pins.
      - run: scripts/install-actionlint.sh
      - run: just lint-workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # `install-service` against the real service managers (#544): launchd on
  # macOS, a systemd user manager on Linux. The stand-ins the tests use take
  # the manager's commands at their word, so #542's race showed only on a real
  # Mac. scripts/service-contract.sh runs the adapter's contract against the
  # real manager, then the real binary: install, install again over the
  # running service, remove. Both fail, never skip, when no manager answers.
  # Not a required check: the maintainer may add it to the ruleset once it has
  # a clean record (development.md §13.8).
  service:
    name: Service managers (${{ matrix.name }})
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: launchd
            os: macos-26
          - name: systemd
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      LADDERBACK_TEST_REAL_SERVICE_MANAGER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      # The runner starts jobs outside any login session, so its user has no
      # systemd user manager. Lingering starts one (`user@<uid>.service`), as
      # at boot for a lingering user; the step waits until it answers, and
      # fails if it doesn't within 30 s. macOS needs nothing: the runner user
      # is logged in, with a GUI session launchd serves.
      - if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          runtime="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            if XDG_RUNTIME_DIR="$runtime" systemctl --user show-environment > /dev/null 2>&1; then
              {
                echo "XDG_RUNTIME_DIR=$runtime"
                echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "no systemd user manager answers for $(id -un) after 30 s of lingering" >&2
          exit 1
      - run: scripts/service-contract.sh contract
      # Runs after a failed contract too, so one run shows both results. The
      # runner is thrown away after the job, so the step may install the real
      # service, which it does only when told so.
      - if: ${{ !cancelled() }}
        run: scripts/service-contract.sh install
        env:
          LADDERBACK_TEST_INSTALL_SERVICE: "1"
      # Leaves the build cache to the `Check` jobs (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The tests of the build a release is: `--no-default-features`, which leaves
  # out the development pseudolocales (technical design §8.4). `just test`
  # builds with the defaults, so the tests that exist only without them run
  # here alone. A job of its own, so that the `Check` jobs stay as they are and
  # this one builds beside them. A required check (ruleset "Protect main"):
  # don't rename it.
  release-tests:
    name: Release-build tests (no default features)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
      # The rustic CLI an e2e scenario compares against (§6.2), as in `check`:
      # without it that scenario skips, and the skip list would differ.
      - run: scripts/install-rustic.sh
      # The ci profile (.config/nextest.toml) retries and reports flaky tests.
      - run: just test-release
        env:
          NEXTEST_PROFILE: ci
      # Leaves the build cache to `Check (ubuntu-latest)` (top of this file).
      - if: github.event_name == 'push'
        run: rm -rf target

  # The dependency tree against deny.toml: RustSec advisories, licences, banned
  # crates and sources (technical design §13.6). It also runs on the nightly
  # schedule, because an advisory can appear with no change to the code; a
  # scheduled run notifies no one, so a failed one opens an issue (`deny-report`
  # below), as `mutants-nightly` does. Not a required check: the maintainer may
  # add it to the ruleset once it has proved stable. It fetches the advisory
  # database, so a GitHub outage can fail it for a reason that isn't a
  # dependency's.
  deny:
    name: Dependencies (cargo-deny)
    needs: changes
    # `changes` is skipped on a push, the nightly run and a manual run; with
    # `!cancelled()` this job runs then, and only a docs-only pull request skips it.
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # cargo-deny reads the tree through `cargo metadata`, which needs the
      # toolchain rust-toolchain.toml names. Nothing is compiled, so no build cache.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-deny
      - run: just deny

  # A failed nightly `deny` opens an issue, or comments on the open one. A job
  # of its own, as release-builds.yml's `report` is, so only it holds
  # `issues: write`, and `deny`, which runs a pull request's code (its
  # Cargo.lock and deny.toml), doesn't. Its name matches no required check.
  deny-report:
    name: Report a failed nightly dependency check
    needs: deny
    # Only on the nightly run, and only when `deny` failed, not when it was
    # cancelled. The title is fixed, so a second failure finds the open issue.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One report at a time, so two failed runs don't both open an issue.
    concurrency:
      group: ci-deny-report
      cancel-in-progress: false
    permissions:
      issues: write # to open or comment on the issue; no checkout, so no contents
    steps:
      # `$/`: the action from the commit this workflow runs, with no checkout.
      - uses: $/.github/actions/report-nightly-failure
        with:
          title: Nightly dependency check failed
          body: "The nightly dependency check (`just deny`) failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. A new RustSec advisory is the usual cause; the job's log names it."

  # The pull request's mutants, split over four runners. One runner, even two
  # mutants at a time, outran the 60-minute limit on a large change (#443:
  # 371 mutants), so each shard takes every fourth mutant (round-robin, which
  # spreads the slow `app` mutants evenly) within that limit.
  mutants-shard:
    name: Mutation testing (shard ${{ matrix.shard }} of 4)
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-mutants
      # Two mutants at a time: each builds in its own copy of the tree, and the
      # runner has four cores. `--caught --unviable` print every outcome as it
      # comes, so a shard that runs out of time shows how far it got.
      - run: just mutants "origin/$BASE_REF" --jobs 2 --shard "$SHARD/4" --sharding round-robin --caught --unviable
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
      # On a timeout too, which GitHub reports as a cancel, not a failure.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # The check the ruleset requires, by this name: it passes only when every
  # shard passed. `always()`, not `!cancelled()`: it must run, and so fail,
  # whenever a shard failed, timed out (a timeout ends a job as cancelled) or
  # was cancelled, since GitHub counts a skipped required check as passing.
  # A superseded run's summary then fails on a stale commit, which is
  # harmless. A docs-only pull request skips it with the shards, as before;
  # keep the rest of this `if` the same as the shards'.
  mutants:
    name: Mutation testing (changed code)
    needs: [changes, mutants-shard]
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: test "$SHARDS" = success || { echo "a mutation shard ended $SHARDS"; exit 1; }
        env:
          SHARDS: ${{ needs.mutants-shard.result }}

  # A scheduled run notifies no one, so a failure opens an issue, or comments
  # on the one already open, rather than going unseen.
  mutants-nightly:
    name: Mutation testing (full)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the toolchain rust-toolchain.toml names, so mbx keys on it.
      - run: rustup toolchain install
      - uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        continue-on-error: true
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-mutants
      - run: just mutants-all
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants.out
          path: mutants.out
          retention-days: 14
      # Only on a failure of this job's own steps (a timeout counts), not on
      # a cancel. The title is fixed, so a second failure finds the open issue.
      - if: failure()
        uses: $/.github/actions/report-nightly-failure
        with:
          title: Nightly mutation run failed
          body: "The full mutation run (`just mutants-all`) failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The run's `mutants.out` artifact lists the missed mutants and timeouts."
